name: Publish Channel Income OS release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/**"
      - "README.md"
      - "LICENSE"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/release.yml"
      - ".github/scripts/release_plan.py"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current, unreleased version from main after verification
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: channel-income-os-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify source
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.2.2.post1
          python -m build --wheel
      - name: Determine release intent
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUEST_PUBLICATION: ${{ inputs.publish }}
        run: python .github/scripts/release_plan.py
      - name: Publish a new GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Release versions identify published bytes. Use a new version for changed artifacts.
          # Creation fails if the release already exists; never upload over or edit it.
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "::error::Tag $TAG already points to another commit."
              exit 1
            }
          fi
          if ! gh release create "$TAG" dist/*.whl \
            --target "$GITHUB_SHA" \
            --title "Channel Income OS $TAG" \
            --notes-file RELEASE_NOTES.md; then
            echo '::error::Release creation failed. Existing releases are preserved; changed artifacts require a new version in pyproject.toml.'
            exit 1
          fi
