name: Publish Channel Income OS release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/**"
      - "README.md"
      - "LICENSE"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-income-os-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify source
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.2.2.post1
          python -m build --wheel
      - name: Read version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl --clobber
            gh release edit "$TAG" --title "Channel Income OS $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/*.whl \
              --target "$GITHUB_SHA" \
              --title "Channel Income OS $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
