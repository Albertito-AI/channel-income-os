name: Install Channel Income OS

on:
  push:
    branches:
      - main
    paths:
      - '.channel_os_payload_*'
      - '.github/workflows/bootstrap-channel-income-os.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-channel-income-os
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Expand verified public product
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .channel_os_payload_00 \
            .channel_os_payload_01 \
            .channel_os_payload_02 \
            .channel_os_payload_03 \
            .channel_os_payload_04 \
            .channel_os_payload_05 \
            .channel_os_payload_06 \
            .channel_os_payload_07 \
            .channel_os_payload_08 \
            .channel_os_payload_09 \
            .channel_os_payload_10 \
            .channel_os_payload_11 \
            .channel_os_payload_12 \
            > /tmp/channel-income-os.b64
          base64 --decode /tmp/channel-income-os.b64 > /tmp/channel-income-os.zip
          echo '310d9876f06f4f224f4079c01ebb3d330e6cdebbaf3d586d3fda0c93f5495ca0  /tmp/channel-income-os.zip' | sha256sum --check --strict
          unzip -oq /tmp/channel-income-os.zip -d .
          rm -f .channel_os_payload_*

      - name: Verify source, tests and demonstration
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m channel_income_os demo --output build/demo
          test -s build/demo/report.md
          test -s build/demo/dashboard.html
          test -s build/demo/action_queue.csv
          test -s build/demo/scorecard.json

      - name: Commit published product core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
          else
            git commit -m 'Publish Channel Income OS v0.1.0 core [skip ci]'
            git push origin HEAD:main
          fi
