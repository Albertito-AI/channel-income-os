name: Bug report
description: Report a reproducible problem using synthetic or redacted data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload real revenue exports, personal data, credentials or unpublished client data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the command and a minimal synthetic CSV if necessary.
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data confirmation
      options:
        - I confirm that the report contains no real creator or client analytics.
    validations:
      required: true
